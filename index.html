<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCP-9221 // WHITE LILY</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

:root {
    --white: #ffffff;
    --milk: #fffafd;
    --pink-1: #fff1f7;
    --pink-2: #ffddea;
    --pink-3: #f5b6cd;
    --pink-4: #d98da9;
    --silver: #d8d4d8;
    --text: #6e5863;
    --dark-text: #4d3a44;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255, 220, 235, 0.9) 0%,
            rgba(255, 241, 247, 0.7) 23%,
            rgba(255, 250, 252, 1) 63%
        );

    font-family: "Inter", sans-serif;
    color: var(--text);
}

/* =========================================================
   ROOT SCENE
========================================================= */

.scene {
    position: relative;

    width: 100%;
    min-height: 520px;
    height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* мягкая сетка */

.scene::before {
    content: "";

    position: absolute;
    inset: 0;

    opacity: 0.22;

    background-image:
        linear-gradient(
            rgba(218, 160, 185, 0.16) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(218, 160, 185, 0.16) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image: radial-gradient(
        circle at center,
        black 0%,
        transparent 75%
    );

    pointer-events: none;
}

/* зерно */

.grain {
    position: absolute;
    inset: 0;

    opacity: 0.045;

    pointer-events: none;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");

    mix-blend-mode: multiply;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: absolute;

    top: 27px;
    left: 38px;
    right: 38px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 20;

    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;

    color: rgba(110, 88, 99, 0.55);
}

.header-left {
    display: flex;
    gap: 18px;
    align-items: center;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #e6a4bc;

    box-shadow:
        0 0 0 4px rgba(230, 164, 188, 0.12),
        0 0 15px rgba(230, 164, 188, 0.6);

    animation: breathe 2.7s infinite ease-in-out;
}

@keyframes breathe {

    0%,
    100% {
        opacity: .55;
        transform: scale(.9);
    }

    50% {
        opacity: 1;
        transform: scale(1.05);
    }
}

/* =========================================================
   CENTER
========================================================= */

.core {
    position: relative;

    width: min(720px, 92vw);
    height: 430px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    z-index: 10;
}

/* верхний текст */

.classification {
    position: absolute;

    top: 17px;

    font-size: 9px;
    letter-spacing: 4px;

    color: rgba(110, 88, 99, 0.4);

    text-transform: uppercase;

    transition: opacity .4s;
}

/* заголовок */

.title {
    position: relative;

    text-align: center;

    margin-top: -30px;

    transition:
        transform 1.5s cubic-bezier(.16,1,.3,1),
        opacity 1s;
}

.title-small {
    display: block;

    margin-bottom: 13px;

    font-size: 11px;
    font-weight: 500;

    letter-spacing: 7px;

    color: rgba(110, 88, 99, 0.52);
}

.title-main {
    display: block;

    font-family: "Montserrat", sans-serif;

    font-size: clamp(32px, 6vw, 58px);

    font-weight: 300;

    letter-spacing: 12px;

    color: rgba(77,58,68,0.9);

    margin-right: -12px;
}

.title-sub {
    display: block;

    margin-top: 15px;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 7px;

    color: rgba(110, 88, 99, 0.48);
}

/* =========================================================
   CORE SYMBOL
========================================================= */

.symbol {
    position: absolute;

    width: 140px;
    height: 140px;

    top: 113px;

    border-radius: 50%;

    border: 1px solid rgba(217,141,169,.25);

    opacity: .8;

    pointer-events: none;

    transition:
        transform 2s cubic-bezier(.16,1,.3,1),
        opacity 1s;
}

.symbol::before,
.symbol::after {
    content: "";

    position: absolute;

    inset: 13px;

    border-radius: 50%;

    border: 1px solid rgba(217,141,169,.14);
}

.symbol::after {
    inset: 33px;

    border-color: rgba(217,141,169,.22);
}

/* =========================================================
   BUTTON AREA
========================================================= */

.buttons {
    position: absolute;

    bottom: 47px;

    width: 100%;
    height: 130px;

    display: flex;
    justify-content: center;
    align-items: flex-end;
}

/* Главная кнопка */

.access {
    position: relative;

    width: 290px;
    height: 62px;

    border: 1px solid rgba(180,136,153,.48);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.9),
            rgba(255,245,249,.95)
        );

    color: var(--dark-text);

    font-family: "Inter", sans-serif;
    font-size: 10px;
    font-weight: 500;

    letter-spacing: 4px;

    cursor: pointer;

    box-shadow:
        0 12px 45px rgba(205,147,171,.12),
        inset 0 1px rgba(255,255,255,1);

    transition:
        transform .6s cubic-bezier(.16,1,.3,1),
        opacity .7s,
        filter .7s,
        box-shadow .5s;
}

.access::before {
    content: "";

    position: absolute;
    inset: 6px;

    border: 1px solid rgba(217,141,169,.14);

    pointer-events: none;
}

.access:hover {
    transform: translateY(-3px);

    box-shadow:
        0 16px 55px rgba(205,147,171,.22),
        0 0 35px rgba(255,216,231,.4);
}

.access.locked {
    transform: scale(.94);

    opacity: .55;

    filter: saturate(.5);

    cursor: default;
}

/* внутренний блеск */

.access-shine {
    position: absolute;

    top: 0;
    left: -30%;

    width: 20%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.85),
        transparent
    );

    transform: skewX(-20deg);

    transition: left .8s;
}

.access:hover .access-shine {
    left: 115%;
}

/* =========================================================
   SECOND BUTTON
========================================================= */

.dossier {
    position: absolute;

    bottom: 93px;

    width: 300px;
    height: 57px;

    opacity: 0;
    pointer-events: none;

    transform:
        translateY(28px)
        scale(.92);

    border: 1px solid rgba(204,126,156,.66);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.98),
            rgba(255,235,243,.98)
        );

    color: #795665;

    font-family: "Inter", sans-serif;
    font-size: 10px;

    letter-spacing: 4px;

    cursor: pointer;

    box-shadow:
        0 10px 35px rgba(218,141,169,.12);

    transition:
        opacity 1s .15s,
        transform 1s cubic-bezier(.16,1,.3,1),
        box-shadow .35s;
}

.dossier.visible {
    opacity: 1;
    pointer-events: auto;

    transform:
        translateY(0)
        scale(1);

    box-shadow:
        0 14px 45px rgba(218,141,169,.22),
        0 0 40px rgba(255,215,230,.55);
}

.dossier:hover {
    box-shadow:
        0 18px 55px rgba(218,141,169,.3),
        0 0 70px rgba(255,215,230,.65);

    transform:
        translateY(-3px)
        scale(1.02);
}

/* =========================================================
   STATUS
========================================================= */

.bottom-status {
    position: absolute;

    bottom: 27px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 8px;

    letter-spacing: 4px;

    color: rgba(110,88,99,.28);

    text-transform: uppercase;

    transition: color .5s;
}

/* =========================================================
   CHAIN SYSTEM
========================================================= */

.chain-system {
    position: absolute;

    inset: -180px;

    pointer-events: none;

    z-index: 30;

    opacity: 0;

    transition: opacity .25s;
}

.chain {
    position: absolute;

    width: 510px;
    height: 90px;

    background-image:
        url("assets/BikeChain.png");

    background-repeat: repeat-x;
    background-size: 145px auto;

    /*
       У изображения остаётся исходная текстура,
       но визуально превращаем её в бело-серебряную цепь.
    */

    filter:
        grayscale(1)
        brightness(1.55)
        contrast(.78)
        drop-shadow(0 0 3px rgba(255,255,255,.95))
        drop-shadow(0 0 10px rgba(234,165,190,.42));

    opacity: 0;

    transform-origin: center;
}

/* четыре стороны */

.chain-top {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translateY(-350px)
        rotate(7deg);
}

.chain-bottom {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translateY(350px)
        rotate(187deg);
}

.chain-left {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translateX(-420px)
        rotate(97deg);
}

.chain-right {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translateX(420px)
        rotate(277deg);
}

/* диагонали */

.chain-diagonal-a {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translate(-420px,-310px)
        rotate(40deg);

    width: 390px;
}

.chain-diagonal-b {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translate(420px,-310px)
        rotate(140deg);

    width: 390px;
}

.chain-diagonal-c {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translate(-420px,310px)
        rotate(140deg);

    width: 390px;
}

.chain-diagonal-d {
    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        translate(420px,310px)
        rotate(40deg);

    width: 390px;
}

/* =========================================================
   ACTIVATION
========================================================= */

.active .chain-system {
    opacity: 1;
}

.active .chain {
    animation: chain-collapse 1.8s cubic-bezier(.22,.8,.25,1) forwards;
}

.active .chain-top {
    animation-delay: 0s;
}

.active .chain-right {
    animation-delay: .08s;
}

.active .chain-bottom {
    animation-delay: .16s;
}

.active .chain-left {
    animation-delay: .24s;
}

.active .chain-diagonal-a {
    animation-delay: .14s;
}

.active .chain-diagonal-b {
    animation-delay: .2s;
}

.active .chain-diagonal-c {
    animation-delay: .27s;
}

.active .chain-diagonal-d {
    animation-delay: .34s;
}

@keyframes chain-collapse {

    0% {
        opacity: 0;

        filter:
            grayscale(1)
            brightness(2.3)
            blur(7px)
            drop-shadow(0 0 25px rgba(255,200,220,.85));
    }

    30% {
        opacity: .8;
    }

    100% {
        opacity: .96;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%)
            scale(.82)
            rotate(var(--rotation));

        filter:
            grayscale(1)
            brightness(1.65)
            contrast(.75)
            drop-shadow(0 0 5px rgba(255,255,255,.9))
            drop-shadow(0 0 14px rgba(230,160,190,.45));
    }
}

/* =========================================================
   WHITE FLASH
========================================================= */

.flash {
    position: absolute;
    inset: 0;

    z-index: 100;

    background: white;

    opacity: 0;

    pointer-events: none;
}

.flash.fire {
    animation: flash .75s ease-out forwards;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: .94;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================================
   DIVINE PUNISHMENT TEXT
========================================================= */

.divine {
    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 80;

    transform:
        translate(-50%, -50%)
        scale(.8);

    opacity: 0;

    text-align: center;

    pointer-events: none;

    transition:
        opacity .8s,
        transform 1s cubic-bezier(.16,1,.3,1);
}

.divine.active {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.divine-main {
    font-family: "Montserrat", sans-serif;

    font-size: clamp(20px, 3.5vw, 34px);

    font-weight: 300;

    letter-spacing: 9px;

    margin-right: -9px;

    color: #6f4f5d;

    text-shadow:
        0 0 25px rgba(255,255,255,.9);
}

.divine-sub {
    margin-top: 13px;

    font-size: 8px;

    letter-spacing: 5px;

    color: rgba(110,88,99,.45);
}

/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;

    inset: 0;

    z-index: 50;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px #fff,
        0 0 15px rgba(231,156,187,.55);

    opacity: 0;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .scene {
        min-height: 500px;
    }

    .header {
        left: 20px;
        right: 20px;

        font-size: 8px;

        letter-spacing: 2px;
    }

    .title-main {
        font-size: 28px;
        letter-spacing: 7px;
        margin-right: -7px;
    }

    .title-sub {
        font-size: 9px;
        letter-spacing: 4px;
    }

    .access {
        width: 250px;
        height: 58px;
    }

    .dossier {
        width: 260px;
    }

    .chain {
        transform-origin: center;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="grain"></div>

    <!-- HEADER -->

    <div class="header">

        <div class="header-left">
            <span class="status-dot"></span>
            <span>SCP FOUNDATION</span>
        </div>

        <span>LEVEL 4 / 9221</span>

    </div>


    <!-- MAIN -->

    <div class="core">

        <div class="classification">
            ANOMALOUS PERSONNEL RECORD
        </div>


        <div class="symbol"></div>


        <div class="title">

            <span class="title-small">
                SCP-9221
            </span>

            <span class="title-main">
                WHITE LILY
            </span>

            <span class="title-sub">
                "БЕЛАЯ ЛИЛИЯ"
            </span>

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="access"
                id="accessBtn"
                type="button">

                <span class="access-shine"></span>

                <span id="accessText">
                    ESTABLISH CONNECTION
                </span>

            </button>


            <button
                class="dossier"
                id="dossierBtn"
                type="button">

                ACCESS DOSSIER

            </button>

        </div>

    </div>


    <!-- CHAINS -->

    <div class="chain-system" id="chains">

        <div class="chain chain-top"></div>
        <div class="chain chain-right"></div>
        <div class="chain chain-bottom"></div>
        <div class="chain chain-left"></div>

        <div class="chain chain-diagonal-a"></div>
        <div class="chain chain-diagonal-b"></div>
        <div class="chain chain-diagonal-c"></div>
        <div class="chain chain-diagonal-d"></div>

    </div>


    <!-- DIVINE -->

    <div class="divine" id="divine">

        <div class="divine-main">
            DIVINE PUNISHMENT
        </div>

        <div class="divine-sub">
            TARGET SEALED // ACCESS RESTRICTED
        </div>

    </div>


    <!-- PARTICLES -->

    <div class="particles" id="particles"></div>


    <!-- FLASH -->

    <div class="flash" id="flash"></div>


    <!-- STATUS -->

    <div class="bottom-status" id="status">
        SCP-9221 // CONTAINMENT INTERFACE // STANDBY
    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

/*
   СЮДА ВСТАВЬ ССЫЛКУ НА ТВОЮ СТРАНИЦУ GOOGLE SITES.
*/

const DOSSIER_URL =
    "https://example.com";


/*
   Сколько секунд до появления
   кнопки перехода.
*/

const DOSSIER_DELAY = 3000;


/* =========================================================
   ELEMENTS
========================================================= */

const scene =
    document.getElementById("scene");

const accessBtn =
    document.getElementById("accessBtn");

const accessText =
    document.getElementById("accessText");

const dossierBtn =
    document.getElementById("dossierBtn");

const divine =
    document.getElementById("divine");

const flash =
    document.getElementById("flash");

const status =
    document.getElementById("status");

const particles =
    document.getElementById("particles");


/* =========================================================
   STATE
========================================================= */

let activated = false;


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    particles.innerHTML = "";

    const count = 65;

    for (let i = 0; i < count; i++) {

        const p =
            document.createElement("div");

        p.className = "particle";

        const x =
            50 +
            (Math.random() - 0.5) * 55;

        const y =
            50 +
            (Math.random() - 0.5) * 55;

        p.style.left = x + "%";
        p.style.top = y + "%";

        const delay =
            Math.random() * 1.5;

        const size =
            1 + Math.random() * 3;

        p.style.width = size + "px";
        p.style.height = size + "px";

        p.animate(
            [
                {
                    opacity: 0,
                    transform: "translate(0,0) scale(.5)"
                },
                {
                    opacity: .9,
                    transform:
                        "translate(" +
                        ((Math.random() - .5) * 90) +
                        "px," +
                        ((Math.random() - .5) * 90) +
                        "px) scale(1)"
                },
                {
                    opacity: 0,
                    transform:
                        "translate(" +
                        ((Math.random() - .5) * 150) +
                        "px," +
                        ((Math.random() - .5) * 150) +
                        "px) scale(.2)"
                }
            ],
            {
                duration:
                    1600 + Math.random() * 1800,

                delay:
                    delay * 300,

                iterations: 1,

                easing:
                    "cubic-bezier(.16,1,.3,1)"
            }
        );

        particles.appendChild(p);

    }
}


/* =========================================================
   ACTIVATION
========================================================= */

function activate() {

    if (activated)
        return;

    activated = true;


    /* блокируем кнопку */

    accessBtn.classList.add("locked");

    accessText.textContent =
        "CONNECTION LOCKED";


    /* меняем статус */

    status.textContent =
        "SCP-9221 // DIVINE RESPONSE DETECTED";


    /* запускаем цепи */

    scene.classList.add("active");


    /* частицы */

    createParticles();


    /*
       Через ~1.6 секунды
       показываем Divine Punishment
    */

    setTimeout(() => {

        divine.classList.add("active");

    }, 1450);


    /*
       Через ~2.2 секунды
       белая вспышка
    */

    setTimeout(() => {

        flash.classList.add("fire");

    }, 2150);


    /*
       Через 3 секунды
       новая кнопка
    */

    setTimeout(() => {

        dossierBtn.classList.add("visible");

        status.textContent =
            "ACCESS GRANTED // DOSSIER AVAILABLE";

    }, DOSSIER_DELAY);

}


/* =========================================================
   EVENTS
========================================================= */

accessBtn.addEventListener(
    "click",
    activate
);


dossierBtn.addEventListener(
    "click",
    () => {

        /*
           Переход на Google Sites.

           top нужен потому, что GitHub Pages
           может быть вставлен внутрь iframe
           Google Sites.
        */

        window.top.location.href =
            DOSSIER_URL;

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter" &&
            !activated
        ) {

            activate();

        }

    }
);

</script>

</body>
</html>
