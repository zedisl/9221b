<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7fb">
  <title>SCP-9221 // WHITE LILY</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="scene" id="scene">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="grid"></div>
    <div class="grain"></div>

    <header class="header">
      <div class="header-side">
        <span class="status-dot" aria-hidden="true"></span>
        <span>SCP FOUNDATION</span>
      </div>
      <span>LEVEL 4 / 9221</span>
    </header>

    <section class="core" aria-label="SCP-9221 access interface">
      <div class="classification">ANOMALOUS PERSONNEL RECORD</div>

      <div class="lily-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <div class="title">
        <div class="title-small">SCP-9221</div>
        <h1>WHITE LILY</h1>
        <div class="title-sub">«БЕЛАЯ ЛИЛИЯ»</div>
      </div>

      <div class="button-stage">
        <button class="access-button" id="accessButton" type="button">
          <span class="button-glow"></span>
          <span class="button-label" id="buttonLabel">ESTABLISH CONNECTION</span>
          <span class="button-corners" aria-hidden="true"></span>
        </button>

        <button class="dossier-button" id="dossierButton" type="button">
          ACCESS DOSSIER
        </button>
      </div>
    </section>

    <div class="chain-layer" id="chainLayer" aria-hidden="true"></div>

    <section class="divine-message" id="divineMessage" aria-live="polite">
      <div class="divine-title">DIVINE PUNISHMENT</div>
      <div class="divine-subtitle">TARGET SEALED // ACCESS RESTRICTED</div>
    </section>

    <div class="seal-flash" id="sealFlash" aria-hidden="true"></div>

    <div class="status-line" id="statusLine">
      SCP-9221 // CONTAINMENT INTERFACE // STANDBY
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
