<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCP-9221 — «Белая Лилия»</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="scene" id="scene">

    <div class="background" aria-hidden="true">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>
      <div class="fine-grid"></div>
      <div class="grain"></div>
    </div>

    <header class="header" id="header">
      <div class="header-left">
        <span class="status-dot"></span>
        <span>ФОНД SCP</span>
      </div>
      <span>УРОВЕНЬ ДОПУСКА 4 / 9221</span>
    </header>

    <section class="hero" id="hero">
      <div class="classification">ФАЙЛ АНОМАЛЬНОГО ОБЪЕКТА</div>

      <div class="medallion" aria-hidden="true">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
      </div>

      <div class="title">
        <div class="scp-number">SCP-9221</div>
        <h1>БЕЛАЯ ЛИЛИЯ</h1>
        <div class="subtitle">ПОТОМСТВЕННАЯ ВЕДЬМА</div>
      </div>

      <div class="main-action">
        <button id="accessButton" class="access-button" type="button">
          <span class="access-label" id="accessLabel">ПОЛУЧИТЬ ДОСТУП</span>
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
        </button>
      </div>
    </section>

    <div id="chainLayer" class="chain-layer" aria-hidden="true"></div>

    <section class="punishment" id="punishment" aria-live="polite">
      <div class="punishment-title">БОЖЕСТВЕННОЕ НАКАЗАНИЕ</div>
      <div class="punishment-subtitle">ЦЕЛЬ ЗАПЕЧАТАНА</div>
    </section>

    <div id="flash" class="flash" aria-hidden="true"></div>

    <section id="finalScene" class="final-scene" aria-hidden="true">
      <div class="final-caption">SCP-9221</div>
      <button id="dossierButton" class="dossier-button" type="button">ОТКРЫТЬ ДОСЬЕ</button>
    </section>

    <div class="status" id="status">
      СИСТЕМА СОДЕРЖАНИЯ // ОЖИДАНИЕ
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
